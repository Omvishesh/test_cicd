name: CI/CD Pipeline

on:
  push:
    branches:
      - dev   # Run only when pushing to dev branch

jobs:
  deploy:
    runs-on: self-hosted   # Use your self-hosted runner inside VPN
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Go to project folder
        run: |
          mkdir -p ~/test_cicd
          cp -r . ~/test_cicd/
          cd ~/test_cicd

      - name: Inject secrets as env vars
        run: |
          export GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          export ACQ_API_KEY=${{ secrets.ACQ_API_KEY }}
          echo "Secrets loaded into environment"

      - name: Deploy with Docker Compose
        working-directory: ~/test_cicd
        run: |
          docker-compose down || true
          docker-compose up -d --build
