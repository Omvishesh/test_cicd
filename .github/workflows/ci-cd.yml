name: CI/CD Pipeline

on:
  push:
    branches:
      - dev   # Run only when pushing to dev branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Inject secrets as env vars
        run: |
          export GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          export ACQ_API_KEY=${{ secrets.ACQ_API_KEY }}
          echo "Secrets loaded into environment"

      - name: Deploy with Docker Compose
        working-directory: /home/clouduser/test_cicd
        run: |
          docker-compose down || true
          docker-compose up -d --build
